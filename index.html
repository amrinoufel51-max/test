<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <script>(function(s){s.dataset.zone='11533776',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <title>Gusto - Annuaire des Restaurants</title>

    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b, #090d16, #020617);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            margin: 0; 
            padding: 30px 15px; 
            direction: ltr; 
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b, #090d16, #020617);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            z-index: -3;
        }

        @keyframes waveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .backdrop-fx {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-mesh {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.03) 0%, transparent 50%);
            filter: blur(40px);
        }

        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: #38bdf8; border-radius: 50%; opacity: 0.3; animation: floatParticle linear infinite; }
        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); } 50% { opacity: 0.6; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.25), rgba(14, 165, 233, 0.05));
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.2), 0 0 15px rgba(14, 165, 233, 0.1);
            animation: riseBubble linear infinite;
        }

        @keyframes riseBubble {
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-110vh) scale(1.2) translateX(30px); opacity: 0; }
        }

        #loader { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #38bdf8, #2563eb); width: 0%; transition: width 0.3s ease-in-out; z-index: 9999; }

        .top-bar {
            max-width: 650px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .menu-toggle-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 22px;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .menu-toggle-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            color: #ffffff;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            transition: opacity 0.3s ease;
        }

        .sidebar {
            position: fixed;
            top: 0; left: -300px;
            width: 280px; height: 100%;
            background: #0b0f19;
            border-right: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.9);
            z-index: 2001;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 15px;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(to right, #38bdf8, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 2px;
        }

        .sidebar-close-btn {
            background: rgba(56, 189, 248, 0.1);
            border: none;
            color: #38bdf8;
            font-size: 18px;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .sidebar-close-btn:hover { background: rgba(56, 189, 248, 0.25); color: #fff; }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .sidebar-link-item {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.15);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-link-item:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            transform: translateX(5px);
            color: #38bdf8;
        }

        .sidebar-footer {
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            padding-top: 15px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .container { 
            max-width: 650px; 
            margin: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title-wrapper { position: relative; margin-bottom: 25px; text-align: center; }

        .site-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .site-title:hover {
            transform: scale(1.02);
        }

        .site-title span {
            display: inline-block;
            opacity: 0;
            transform: scale(1.8) translateY(60px);
            animation: popAndSettleTwice 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: linear-gradient(to right, #38bdf8, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
        }

        .site-title span:nth-child(1) { animation-delay: 0.1s; }
        .site-title span:nth-child(2) { animation-delay: 0.2s; }
        .site-title span:nth-child(3) { animation-delay: 0.3s; }
        .site-title span:nth-child(4) { animation-delay: 0.4s; }
        .site-title span:nth-child(5) { animation-delay: 0.5s; }

        @keyframes popAndSettleTwice {
            0% { opacity: 0; transform: scale(1.8) translateY(80px); }
            40% { opacity: 1; transform: scale(0.9) translateY(-15px); }
            60% { transform: scale(1.1) translateY(8px); }
            80% { opacity: 1; transform: scale(0.97) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .search-box-wrapper {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            border: 1px solid rgba(56, 189, 248, 0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInSearch 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
            margin-bottom: 15px;
        }

        @keyframes fadeInSearch { to { opacity: 1; transform: translateY(0); } }

        .search-box-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 18px;
            background: transparent;
            text-align: left;
            color: #ffffff;
        }
        .search-box-wrapper input::placeholder { color: #64748b; }

        #restaurantSearchWrapper {
            display: none;
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            align-items: center;
            border: 1px solid rgba(56, 189, 248, 0.4);
            margin-bottom: 25px;
        }

        #restaurantSearchWrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 17px;
            background: transparent;
            text-align: left;
            color: #ffffff;
        }
        #restaurantSearchWrapper input::placeholder { color: #94a3b8; }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        .restaurant-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 24px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.6);
        }

        .profile-img-wrapper {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .restaurant-card:hover .profile-img {
            transform: scale(1.02);
        }

        .restaurant-info { width: 100%; }
        .restaurant-info h3 { margin: 0 0 8px 0; font-size: 24px; color: #ffffff; }
        .restaurant-info p { margin: 0 0 12px 0; font-size: 16px; color: #94a3b8; }

        .card-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .menu-trigger-btn {
            flex: 1;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .menu-trigger-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .phone-action-btn {
            flex: 1;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .phone-action-btn:hover { opacity: 0.9; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            z-index: 3000;
            justify-content: center; align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0b0f19;
            border: 1px solid rgba(56, 189, 248, 0.4);
            max-width: 800px; width: 100%;
            border-radius: 20px; padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            text-align: center; position: relative;
            max-height: 95vh; overflow-y: auto;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: rgba(56, 189, 248, 0.1); border: none;
            color: #38bdf8; font-size: 20px; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        .close-btn:hover { background: rgba(56, 189, 248, 0.3); color: #fff; }

        .modal-title { font-size: 24px; color: #ffffff; margin: 0 0 15px 0; }

        .menu-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-top: 15px;
        }

        .hd-menu-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: block;
        }

        .no-result { text-align: center; color: #94a3b8; font-size: 16px; margin-top: 30px; font-weight: 500; }
    </style>
</head>
<body>

<div id="loader"></div>

<div class="backdrop-fx">
    <div class="glow-mesh"></div>
    <div id="particles-js"></div>
    <div id="bubbles-container"></div>
</div>

<div class="top-bar">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3 class="sidebar-title">Gusto</h3>
        <button class="sidebar-close-btn" onclick="toggleSidebar()">×</button>
    </div>
    <div class="sidebar-links">
        <a class="sidebar-link-item" onclick="openLegalModal('about'); toggleSidebar();">ℹ️ About Us</a>
        <a class="sidebar-link-item" onclick="openLegalModal('privacy'); toggleSidebar();">🔒 Privacy Policy</a>
        <a class="sidebar-link-item" onclick="openLegalModal('contact'); toggleSidebar();">📞 Contact Us</a>
    </div>
    <div class="sidebar-footer">
        &copy; 2026 Gusto. Tous droits réservés.
    </div>
</div>

<div class="container" id="mainContainer">
    <div class="title-wrapper">
        <div class="site-title" onclick="window.location.reload()">
            <span>G</span><span>u</span><span>s</span><span>t</span><span>o</span>
        </div>
    </div>

    <div class="search-box-wrapper">
        <span style="margin-right: 10px; font-size: 20px;">📍</span>
        <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: se, alger)..." oninput="searchRestaurants()">
    </div>

    <div id="restaurantSearchWrapper">
        <span style="margin-right: 10px; font-size: 20px;">🍽️</span>
        <input type="text" id="restaurantNameInput" placeholder="Rechercher par nom de restaurant (optionnel)..." oninput="filterByRestaurantName()">
    </div>

    <div id="resultsContainer" class="grid-container"></div>
</div>

<div id="restaurantModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <h2 id="modalName" class="modal-title"></h2>
        <div id="menuGallery" class="menu-gallery"></div>
    </div>
</div>

<script>
    const wilayasList = [
        "adrar", "chlef", "laghouat", "oum_el_bouaghi", "batna", "bejaia", "biskra", "bechar", 
        "blida", "bouira", "tamanrasset", "tbessa", "tlemcen", "tiaret", "tizi_ouzou", "alger", 
        "djelfa", "jijel", "setif", "saida", "skikda", "sidi_bel_abbes", "annaba", "guelma", 
        "constantine", "medea", "mostaganem", "msila", "mascara", "ouargla", "oran", "el_bayadh", 
        "illizi", "bordj_bou_arreridj", "boumerdes", "el_tarf", "tindouf", "tissemsilt", "el_oued", 
        "khenchela", "souk_ahras", "tipaza", "mila", "ain_defla", "naama", "ain_temouchent", 
        "ghardaia", "relizane", "timimoun", "bordj_badji_mokhtar", "ouled_djellal", "beni_abbes", 
        "in_guezzam", "in_salah", "janet", "el_meghaier", "el_meniaa"
    ];

    let allRestaurants = [];
    let filteredRestaurants = [];
    let displayedCount = 0;
    const batchSize = 10;
    let currentMatchedWilaya = "";

    function createParticles() {
        const container = document.getElementById("particles-js");
        for (let i = 0; i < 25; i++) {
            let p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.width = p.style.height = (Math.random() * 4 + 2) + "px";
            p.style.animationDuration = (Math.random() * 6 + 6) + "s";
            p.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(p);
        }
    }

    function createBubbles() {
        const container = document.getElementById("bubbles-container");
        for (let i = 0; i < 15; i++) {
            let b = document.createElement("div");
            b.className = "bubble";
            let size = Math.random() * 35 + 15;
            b.style.width = size + "px";
            b.style.height = size + "px";
            b.style.left = Math.random() * 100 + "%";
            b.style.animationDuration = (Math.random() * 8 + 6) + "s";
            b.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(b);
        }
    }

    createParticles();
    createBubbles();

    function toggleSidebar() {
        let sidebar = document.getElementById("sidebar");
        let overlay = document.getElementById("sidebarOverlay");
        
        if (sidebar.classList.contains("active")) {
            sidebar.classList.remove("active");
            overlay.style.display = "none";
        } else {
            sidebar.classList.add("active");
            overlay.style.display = "block";
        }
    }

    async function searchRestaurants() {
        let loader = document.getElementById("loader");
        loader.style.width = "100%";

        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let formattedQuery = query.replace(/\s+/g, "_");

        let container = document.getElementById("resultsContainer");
        let mainContainer = document.getElementById("mainContainer");
        let restaurantSearchWrapper = document.getElementById("restaurantSearchWrapper");
        
        container.innerHTML = "";
        allRestaurants = [];
        filteredRestaurants = [];
        displayedCount = 0;
        currentMatchedWilaya = "";
        restaurantSearchWrapper.style.display = "none";
        document.getElementById("restaurantNameInput").value = "";

        if (query === "") {
            loader.style.width = "0%";
            mainContainer.style.justifyContent = "center";
            mainContainer.style.minHeight = "75vh";
            return;
        }

        mainContainer.style.justifyContent = "flex-start";
        mainContainer.style.minHeight = "unset";

        let matchedWilaya = wilayasList.find(w => w.startsWith(formattedQuery) || w.includes(formattedQuery));

        if (!matchedWilaya) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Wilaya introuvable...</p>";
            return;
        }

        currentMatchedWilaya = matchedWilaya;

        try {
            let partIndex = 1;
            let combinedData = [];

            while (true) {
                let fileName = partIndex === 1 ? `${matchedWilaya}.json` : `${matchedWilaya}_${partIndex}.json`;
                try {
                    let response = await fetch(fileName);
                    if (!response.ok) break;
                    let data = await response.json();
                    combinedData = combinedData.concat(data);
                    partIndex++;
                } catch (e) {
                    break;
                }
            }

            if (combinedData.length === 0) {
                loader.style.width = "0%";
                container.innerHTML = `<p class='no-result'>Aucun restaurant pour ${matchedWilaya.toUpperCase()} pour le moment.</p>`;
                return;
            }

            allRestaurants = combinedData;
            filteredRestaurants = combinedData;
            loader.style.width = "0%";

            restaurantSearchWrapper.style.display = "flex";

            renderMoreRestaurants();

        } catch (error) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Erreur de chargement.</p>";
        }
    }

    function filterByRestaurantName() {
        let nameQuery = document.getElementById("restaurantNameInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        
        container.innerHTML = "";
        displayedCount = 0;

        if (nameQuery === "") {
            filteredRestaurants = allRestaurants;
        } else {
            filteredRestaurants = allRestaurants.filter(rest => rest.name.toLowerCase().includes(nameQuery));
        }

        if (filteredRestaurants.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun restaurant trouvé avec ce nom...</p>";
            return;
        }

        renderMoreRestaurants();
    }

    function renderMoreRestaurants() {
        let container = document.getElementById("resultsContainer");
        let nextBatch = filteredRestaurants.slice(displayedCount, displayedCount + batchSize);

        nextBatch.forEach((rest) => {
            let card = document.createElement("div");
            card.className = "restaurant-card";
            
            card.innerHTML = `
                <div class="profile-img-wrapper">
                    <img src="${rest.profileImg}" alt="${rest.name}" class="profile-img" loading="lazy">
                </div>
                <div class="restaurant-info">
                    <h3>${rest.name}</h3>
                    <p>📍 ${currentMatchedWilaya.toUpperCase()} — 📞 ${rest.phone}</p>
                    <div class="card-actions">
                        <button class="menu-trigger-btn" onclick='openModal(${JSON.stringify(rest).replace(/'/g, "&#39;")})'>Menu</button>
                        <a href="tel:${rest.phone}" class="phone-action-btn">📞 Appeler</a>
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });

        displayedCount += nextBatch.length;
    }

    window.addEventListener("scroll", () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
            if (displayedCount < filteredRestaurants.length) {
                renderMoreRestaurants();
            }
        }
    });

    function openModal(rest) {
        document.getElementById("modalName").innerText = rest.name + " - Menu";
        let galleryContainer = document.getElementById("menuGallery");
        galleryContainer.innerHTML = "";

        let images = rest.menuImages || [];

        if (images.length === 0) {
            galleryContainer.innerHTML = "<p style='color: #94a3b8;'>Aucun menu disponible pour le moment.</p>";
        } else {
            images.forEach((imgSrc) => {
                let img = document.createElement("img");
                img.src = imgSrc;
                img.className = "hd-menu-img";
                img.alt = "Menu Image";
                img.loading = "lazy";
                galleryContainer.appendChild(img);
            });
        }

        document.getElementById("restaurantModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("restaurantModal").style.display = "none";
    }

    function closeModalOnOutside(event) {
        let modalContent = document.querySelector(".modal-content");
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }

    function openLegalModal(type) {
        let modalName = document.getElementById("modalName");
        let galleryContainer = document.getElementById("menuGallery");
        
        document.getElementById("restaurantModal").style.display = "flex";
        
        if (type === 'about') {
            modalName.innerText = "À propos de Gusto";
            galleryContainer.innerHTML = `
                <p style="color: #94a3b8; line-height: 1.6; text-align: left;">
                    <strong>Gusto</strong> est votre annuaire numérique de référence pour découvrir les meilleurs restaurants à travers toutes les wilayas d'Algérie. Notre mission est de simplifier l'accès aux menus et aux informations des restaurants de manière rapide, fluide et élégante.
                </p>
            `;
        } else if (type === 'privacy') {
            modalName.innerText = "Politique de Confidentialité";

                    Chez <strong>Gusto</strong>, nous respectons votre vie privée. Aucune donnée personnelle sensible n'est collectée lors de votre navigation sur notre annuaire. Les recherches sont traitées localement pour garantir une sécurité totale.

            `;
        } else if (type === 'contact') {
